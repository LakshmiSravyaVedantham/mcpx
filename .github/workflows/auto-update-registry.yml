name: Auto-Update Registry

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scan npm for new MCP servers
        run: python scripts/scan_registry.py

      - name: Check for discoveries
        id: check
        run: |
          if [ -f new_servers_discovered.json ]; then
            count=$(python -c "import json; print(len(json.load(open('new_servers_discovered.json'))))")
            echo "found=$count" >> "$GITHUB_OUTPUT"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Add new servers to registry
        if: steps.check.outputs.found != '0'
        run: |
          python -c "
          import json
          from pathlib import Path

          registry_path = Path('src/mcpx/registry_data.json')
          discoveries_path = Path('new_servers_discovered.json')

          registry = json.loads(registry_path.read_text())
          new_servers = json.loads(discoveries_path.read_text())

          existing_names = {s['name'] for s in registry['servers']}
          added = []
          for server in new_servers:
              if server['name'] not in existing_names:
                  registry['servers'].append(server)
                  added.append(server['name'])

          if added:
              registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')
              print(f'Added {len(added)} servers: {added}')
          "

      - name: Regenerate README
        if: steps.check.outputs.found != '0'
        run: python scripts/generate_readme.py

      - name: Create Pull Request
        if: steps.check.outputs.found != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add newly discovered MCP servers from npm"
          title: "feat: add ${{ steps.check.outputs.found }} new MCP server(s) from npm"
          body: |
            ## Auto-Discovery Results

            Found **${{ steps.check.outputs.found }}** new MCP server package(s) on npm.

            This PR was automatically generated by the weekly registry scan workflow.

            ### Review checklist
            - [ ] Check that new server entries have correct categories
            - [ ] Verify descriptions are accurate
            - [ ] Confirm packages are legitimate MCP servers
          branch: auto/registry-update
          labels: new-server
          delete-branch: true
