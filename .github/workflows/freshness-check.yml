name: Freshness Check

on:
  schedule:
    # Run every Sunday at 6:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run freshness check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_freshness.py | tee freshness_report.txt

      - name: Check for registry changes
        id: diff
        run: |
          if git diff --quiet src/mcpx/registry_data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate README if registry changed
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/generate_readme.py

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update registry star counts and freshness data"
          title: "chore: weekly registry freshness update"
          body: |
            ## Weekly Freshness Check

            This PR updates star counts and checks package availability.

            ### Report
            ```
            $(cat freshness_report.txt)
            ```

            This PR was automatically generated by the weekly freshness check workflow.
          branch: auto/freshness-update
          labels: ci
          delete-branch: true

      - name: Report no changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "All packages are fresh. No changes needed."
