[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpx"
version = "0.1.0"
description = "The package manager for MCP servers. Discover, install, and manage Model Context Protocol servers for Claude Code, Cursor, and VS Code."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sravya Vedantham", email = "sravya@example.com"},
]
keywords = [
    "mcp", "model-context-protocol", "claude", "claude-code",
    "cursor", "ai", "llm", "developer-tools", "cli",
    "package-manager", "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcpx = "mcpx.cli:app"

[project.urls]
Homepage = "https://github.com/LakshmiSravyaVedantham/mcpx"
Repository = "https://github.com/LakshmiSravyaVedantham/mcpx"
Issues = "https://github.com/LakshmiSravyaVedantham/mcpx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=mcpx --cov-report=term-missing"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
